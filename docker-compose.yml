services:
  postgres:
    image: postgres:16-alpine
    container_name: teamchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamchat
      POSTGRES_PASSWORD: teamchat
      POSTGRES_DB: teamchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamchat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teamchat-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: teamchat-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed:
        condition: service_started
    environment:
      PORT: 3000
      DATABASE_URL: postgres://teamchat:teamchat@postgres:5432/teamchat
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      JWT_SECRET: dev-only-change-me
      REFRESH_TOKEN_EXPIRES_IN_DAYS: 30
      S3_ENDPOINT: http://seaweed:8333
      S3_BUCKET: teamchat
      S3_REGION: us-east-1
      S3_ACCESS_KEY: teamchat
      S3_SECRET_KEY: teamchat-dev-only
      S3_FORCE_PATH_STYLE: 'true'
      FILE_MAX_MB: 50
    ports:
      - "3000:3000"
    volumes:
      # Live-mount server source only. No node_modules volume: the image's
      # /app/node_modules is complete, and we never mount host modules in.
      - ./apps/server/src:/app/apps/server/src
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/version').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  desktop:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
    container_name: teamchat-desktop
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      # Live-mount source dirs only — never the package root itself, or the
      # image's pnpm node_modules links get shadowed (MODULE_NOT_FOUND).
      - ./apps/desktop/renderer:/app/apps/desktop/renderer
      - ./apps/desktop/electron:/app/apps/desktop/electron
      - ./apps/desktop/index.html:/app/apps/desktop/index.html

  # Object storage (S3-compatible). MinIO removed its free Docker Hub images,
  # so we use SeaweedFS. Any S3 target works — swapping is config-only
  # (S3_* env). Nothing before Phase 7 needs object storage.
  seaweed:
    image: chrislusf/seaweedfs:latest
    container_name: teamchat-seaweed
    restart: unless-stopped
    command: server -dir=/data -master.volumeSizeLimitMB=256 -s3 -filer
    ports:
      - "8333:8333"
      - "18888:8888"
    volumes:
      - seaweeddata:/data

volumes:
  pgdata:
  seaweeddata:
