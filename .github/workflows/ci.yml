name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm
      - run: pnpm install
      - run: node ./scripts/no-ts-guard.js
      - run: pnpm -r build
      - run: pnpm -r test
  package:
    # Phase 10: proves the desktop app packages on every push. Signing /
    # notarization run only when secrets exist (releases); otherwise the
    # unsigned --dir build + smoke test validate the packaging config.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g pnpm
      - run: pnpm install
      - run: pnpm --filter @teamchat/desktop dist:dir
      - run: pnpm --filter @teamchat/desktop audit
      - run: xvfb-run -a pnpm --filter @teamchat/desktop electron:smoke
